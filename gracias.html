<style>
  * { font-family: 'Montserrat', sans-serif; box-sizing: border-box; }
  h1, h2, h3 { font-family: 'Bebas Neue', sans-serif; letter-spacing: 0.04em; }

  body {
    background-color: #080808;
    color: #f8fafc;
    overflow-x: hidden;
    scrollbar-width: none;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  body::-webkit-scrollbar { display: none; }

  .bg-dynamic {
    background:
      radial-gradient(ellipse 70% 60% at 50% 50%, rgba(180,90,0,0.18) 0%, transparent 70%),
      #080808;
  }

  .dot-grid { position: relative; }
  .dot-grid::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image: radial-gradient(circle at 1.5px 1.5px, rgba(255,255,255,0.04) 1px, transparent 0);
    background-size: 32px 32px;
    pointer-events: none;
    z-index: 0;
  }

  header {
    background: rgba(8,8,8,0.92);
    backdrop-filter: blur(16px);
    border-bottom: 1px solid rgba(255,193,7,0.1);
  }

  .card {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,193,7,0.18);
    border-radius: 0;
  }

  @keyframes pulse-gold {
    0%,100% { box-shadow: 0 0 0 0 rgba(255,193,7,0.45); }
    50%      { box-shadow: 0 0 0 14px rgba(255,193,7,0); }
  }

  .check-circle {
    width: 72px;
    height: 72px;
    border: 2px solid #FFC107;
    display: flex;
    align-items: center;
    justify-content: center;
    animation: pulse-gold 2.5s ease infinite;
  }

  @keyframes spark-travel {
    0%   { left: -15%; opacity: 0; }
    5%   { opacity: 1; }
    92%  { opacity: 1; }
    100% { left: 115%; opacity: 0; }
  }
  .divider {
    position: relative;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255,193,7,0.2), transparent);
    overflow: hidden;
  }
  .divider::after {
    content: '';
    position: absolute;
    top: -2px;
    left: -15%;
    width: 140px;
    height: 5px;
    background: linear-gradient(90deg, transparent, rgba(255,193,7,0.6), #fffde7, rgba(255,193,7,0.6), transparent);
    filter: blur(1.5px);
    animation: spark-travel 5s ease-in-out infinite;
  }
</style>
</head>

    <span class="text-xs font-semibold tracking-widest uppercase" style="color:#FFC107;">Solicitud recibida</span>

      Volver al inicio
    </a>

  </div>
</main>

<div class="divider"></div>

<footer class="py-8 border-t border-white/5" style="background:#050505;">
  <div class="max-w-7xl mx-auto px-6 text-center">
    <p class="text-xs text-gray-600">© 2026 SC Volt. Todos los derechos reservados. · CDMX</p>
  </div>
</footer>
